<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>的小天地</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/jf-openhuninn@1.1.0/jf-openhuninn.css');
        body { font-family: 'jf-openhuninn', sans-serif; background-color: #FDFBF7; color: #5A5043; }
        .card { background: white; border: 1px solid #EBE7DF; border-radius: 1rem; padding: 1.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // === 請填入你的資訊 ===
        const SUPABASE_URL = '你的 URL';
        const SUPABASE_KEY = '你的 Anon Key';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { useState, useEffect } = React;

        function App() {
            const [siteData, setSiteData] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [activeTab, setActiveTab] = useState('about');

            // 載入資料
            useEffect(() => {
                const fetchData = async () => {
                    const { data } = await supabaseClient.from('website_settings').select('data').eq('id', 1).single();
                    if (data && Object.keys(data.data).length > 0) {
                        setSiteData(data.data);
                    } else {
                        // 初始預設值
                        setSiteData({
                            profile: { name: "的小天地", bio: "外表安靜，腦袋裡卻一直在跑故事..." },
                            dietImage: "https://i.imgur.com/your_default_image.png" // 這裡之後可以換成你上傳的那張
                        });
                    }
                };
                fetchData();
            }, []);

            // 儲存文字
            const saveToCloud = async (newData) => {
                await supabaseClient.from('website_settings').upsert({ id: 1, data: newData });
                setSiteData(newData);
            };

            // 上傳圖片並獲取網址
            const uploadImage = async (e, field) => {
                const file = e.target.files[0];
                const fileName = `${Date.now()}_${file.name}`;
                const { data } = await supabaseClient.storage.from('assets').upload(fileName, file);
                
                if (data) {
                    const { data: { publicUrl } } = supabaseClient.storage.from('assets').getPublicUrl(fileName);
                    const updated = { ...siteData, [field]: publicUrl };
                    saveToCloud(updated);
                }
            };

            if (!siteData) return <div className="p-20 text-center">載入專屬天地中...</div>;

            return (
                <div className="max-w-2xl mx-auto px-4 py-10">
                    {/* 頭像區域 */}
                    <div className="text-center mb-8">
                        <div className="relative inline-block">
                            <img src={siteData.avatar || 'https://via.placeholder.com/100'} className="w-24 h-24 rounded-full border-4 border-white shadow-sm mb-4 object-cover" />
                            {isEditing && <input type="file" onChange={(e) => uploadImage(e, 'avatar')} className="absolute inset-0 opacity-0 cursor-pointer" />}
                        </div>
                        <h1 className="text-2xl font-bold">{siteData.profile.name}</h1>
                    </div>

                    {/* 這裡依序放入你原本的 Tabs 與內容 (略，保持邏輯一致) */}
                    
                    {/* 編輯與儲存按鈕 */}
                    <div className="fixed bottom-6 right-6 flex gap-2">
                        <button onClick={() => setIsEditing(!isEditing)} className="bg-white border p-3 rounded-full shadow-lg">
                            {isEditing ? '👀 預覽' : '✍️ 編輯'}
                        </button>
                        {isEditing && (
                            <button onClick={() => alert('已自動同步至雲端！')} className="bg-amber-600 text-white p-3 px-6 rounded-full shadow-lg">
                                確認儲存
                            </button>
                        )}
                    </div>
                </div>
            );
        }
        // ... (ReactDOM Render 邏輯)
    </script>
</body>
</html>
