    const ImageUploader = ({ onUpload, className = "" }) => {
      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => onUpload(reader.result);
        reader.readAsDataURL(file);
      };
      return (
        <label className={`cursor-pointer inline-flex items-center justify-center bg-white border border-amber-200 hover:bg-amber-50 text-[#7A7265] rounded px-3 py-1.5 text-xs transition-colors shadow-sm ${className}`}>
          <input type="file" accept="image/*" onChange={handleFile} className="hidden" />
          <Icon name="Upload" size={14} className="mr-1.5" />
          <span>上傳</span>
        </label>
      );
    };

    const EditableText = ({ value, isEditing, onChange, multiline = false, className = "", placeholder = "" }) => {
      if (!isEditing) {
        return <span className={`whitespace-pre-wrap ${className}`}>{value || placeholder}</span>;
      }
      return multiline ? (
        <textarea 
          value={value} 
          onChange={e => onChange(e.target.value)}
          className={`w-full bg-white/50 border border-amber-200 rounded p-1 focus:outline-none focus:ring-1 focus:ring-amber-400 ${className}`}
          rows={3}
          placeholder={placeholder}
        />
      ) : (
        <input 
          type="text" 
          value={value}

            <button 
              onClick={() => setIsEditing(!isEditing)}
              className={`w-12 h-12 rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex items-center justify-center transition-transform active:scale-95 ${
                isEditing ? 'bg-gray-700 text-white hover:bg-gray-800' : 'bg-white text-[#7A7265] border border-[#EBE7DF] hover:bg-[#F4F1EA]'
              }`}
              title={isEditing ? "退出編輯模式" : "進入編輯模式"}
            >
              <Icon name="Edit3" size={20} />
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
